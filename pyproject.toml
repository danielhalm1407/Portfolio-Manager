[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "portutils"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "yfinance",
    "python-dotenv",
    "pyyaml",
    "dash",
    "plotly",
    "gunicorn",
    "playwright",
    "scikit-learn",
    # Markdown -> HTML for the static report page (pipelines/build_report.py, plan 10-01).
    # Declared rather than relied on transitively: the same objection pricing.py records about
    # scipy applies to any package this repo uses but does not name.
    "markdown-it-py",
    # B-spline bases for the penalised response surface (portutils/strategies/surface.py,
    # plan 13-02 Task 3). Named explicitly because it had been arriving transitively through
    # scikit-learn — which is exactly the situation pricing.py's own objection is about, and
    # the plan requires whichever smoother library is used to be declared rather than assumed.
    # pygam was preferred by the plan where already available; it is not installed, and it is
    # not worth a dependency for two axes and sixty-odd design points when the penalised
    # B-spline it would fit is thirty lines of numpy over this.
    "scipy",
    # Static PNG export of the 3-D response surface (pipelines/option_grid_sweep.py, plan 13-02.1).
    # Plotly's Surface needs WebGL in the viewer's browser, and a browser with graphics
    # acceleration off shows nothing; the PNG is the fallback the published page swaps in.
    "kaleido",
]

[tool.setuptools.packages.find]
where = ["src"]
